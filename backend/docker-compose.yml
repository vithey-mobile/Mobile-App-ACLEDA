    image: vithey-finance-service:local
    container_name: vithey-finance-service
    environment:
      <<: *spring-common
      SERVER_PORT: 8086
      FINANCE_DB_URL: jdbc:postgresql://postgres:5432/finance_db
      FINANCE_DB_USERNAME: postgres
