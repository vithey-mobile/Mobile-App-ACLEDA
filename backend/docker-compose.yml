# Vithey full local stack — infrastructure + all Java microservices
# Usage: docker compose up -d --build

include:
  - path: infrastructure/docker-compose.yml

x-spring-common: &spring-common
  SPRING_PROFILES_ACTIVE: docker
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_CLIENT_ENABLED: "true"
  EUREKA_URL: http://eureka-server:8761/eureka/
  VITHEY_JWT_SECRET: ${VITHEY_JWT_SECRET:-change-me-to-a-strong-256-bit-secret-for-local-dev}

x-service-depends: &service-depends
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  eureka-server:
    condition: service_healthy
  config-server:
    condition: service_healthy

services:
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
      args:
        SERVICE_PORT: 8081
    image: vithey-auth-service:local
    container_name: vithey-auth-service
    environment:
      <<: *spring-common
      SERVER_PORT: 8081
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/auth_db
      AUTH_DB_USERNAME: postgres
      AUTH_DB_PASSWORD: postgres
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      VITHEY_ACCESS_TOKEN_TTL: 15m
      VITHEY_REFRESH_TOKEN_TTL: 7d
      VITHEY_EVENTS_EXCHANGE: vithey.events
    ports:
      - "8081:8081"
    depends_on: *service-depends
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 15
    networks:
      - vithey-network

  user-profile-service:
    build:
      context: .
      dockerfile: services/user-profile-service/Dockerfile
      args:
        SERVICE_PORT: 8082
    image: vithey-user-profile-service:local
    container_name: vithey-user-profile-service
    environment:
      <<: *spring-common
      SERVER_PORT: 8082
      USER_DB_URL: jdbc:postgresql://postgres:5432/user_db
      USER_DB_USERNAME: postgres
      USER_DB_PASSWORD: postgres
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      VITHEY_EVENTS_EXCHANGE: vithey.events
    ports:
      - "8082:8082"
    depends_on: *service-depends
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 15
    networks:
      - vithey-network

  file-service:
    build:
      context: .
      dockerfile: services/file-service/Dockerfile
      args:
        SERVICE_PORT: 8083
    image: vithey-file-service:local
    container_name: vithey-file-service
    environment:
      <<: *spring-common
      SERVER_PORT: 8083
      FILE_DB_URL: jdbc:postgresql://postgres:5432/file_db
      FILE_DB_USERNAME: postgres
      FILE_DB_PASSWORD: postgres
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKETS: avatars,cvs,posters,videos
    ports:
      - "8083:8083"
    depends_on:
      <<: *service-depends
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 15
    networks:
      - vithey-network

  content-service:
