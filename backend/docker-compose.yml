    ports:
      - "8088:8088"
    depends_on: *service-depends
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 15
    networks:
      - vithey-network

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
      args:
        SERVICE_PORT: 8080
    image: vithey-api-gateway:local
    container_name: vithey-api-gateway
    environment:
      <<: *spring-common
      SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      VITHEY_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 15
    networks:
      - vithey-network
