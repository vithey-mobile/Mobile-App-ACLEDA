services:
  auth-service:
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
      args:
        SERVICE_PORT: 8081
    image: vithey-auth-service:local
    container_name: vithey-auth-service
    env_file:
      - .env.example
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    networks:
      - vithey-network

networks:
  vithey-network:
    external: true
