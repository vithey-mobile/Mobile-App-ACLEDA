# Build and run ONLY ai-service from this folder:
#   docker compose up -d --build
#
# 1) Start infrastructure first (once):
#      cd ../../infrastructure && docker compose up -d
# 2) Then from this folder:
#      docker compose up -d --build
#
# Or from backend root:
#   .\scripts\docker-build-service.ps1 ai-service -Up

services:
  ai-service:
    build:
      context: ../..
      dockerfile: services/ai-service/Dockerfile
      args:
        SERVICE_PORT: 8089
    image: vithey-ai-service:local
    container_name: vithey-ai-service
    env_file:
      - .env.example
    ports:
      - "8089:8089"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 12
    networks:
      - vithey-network
    restart: unless-stopped

networks:
  vithey-network:
    external: true
    name: vithey-network