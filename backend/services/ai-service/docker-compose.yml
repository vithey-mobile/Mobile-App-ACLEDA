services:
  ai-service:
    build:
      context: ../..
      dockerfile: services/ai-service/Dockerfile
      args:
        SERVICE_PORT: 8089
    image: vithey-ai-service:local
    container_name: vithey-ai-service
    env_file:
      - .env.example
    ports:
      - "8089:8089"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    networks:
      - vithey-network
      - gdce-network

networks:
  vithey-network:
    external: true
  gdce-network:
    external: true
