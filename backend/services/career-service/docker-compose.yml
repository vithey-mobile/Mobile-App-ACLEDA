services:
  career-service:
    build:
      context: ../..
      dockerfile: services/career-service/Dockerfile
      args:
        SERVICE_PORT: 8085
    image: vithey-career-service:local
    container_name: vithey-career-service
    env_file:
      - .env.example
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    networks:
      - vithey-network

networks:
  vithey-network:
    external: true
