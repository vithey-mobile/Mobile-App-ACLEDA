services:
  career-postgres:
    image: postgres:16-alpine
    container_name: vithey-career-postgres
    environment:
      POSTGRES_DB: career_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - career-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d career_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - vithey-network

  career-service:
    build:
      context: ../..
      dockerfile: services/career-service/Dockerfile
      args:
        SERVICE_PORT: 8085
    image: vithey-career-service:local
    container_name: vithey-career-service
    env_file:
      - .env.example
    ports:
      - "8085:8085"
    depends_on:
      career-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    networks:
      - vithey-network

volumes:
  career-postgres-data:

networks:
  vithey-network:
    external: true
