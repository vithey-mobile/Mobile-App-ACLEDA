services:
  chat-postgres:
    image: postgres:16-alpine
    container_name: vithey-chat-postgres
    environment:
      POSTGRES_DB: chat_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5438:5432"
    volumes:
      - chat-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chat_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - vithey-network

  chat-service:
    build:
      context: ../..
      dockerfile: services/chat-service/Dockerfile
      args:
        SERVICE_PORT: 8087
    image: vithey-chat-service:local
    container_name: vithey-chat-service
    env_file:
      - .env.example
    ports:
      - "8087:8087"
    depends_on:
      chat-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    networks:
      - vithey-network

volumes:
  chat-postgres-data:

networks:
  vithey-network:
    external: true
