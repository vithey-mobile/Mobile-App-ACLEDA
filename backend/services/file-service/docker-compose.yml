services:
  file-service:
    build:
      context: ../..
      dockerfile: services/file-service/Dockerfile
      args:
        SERVICE_PORT: 8083
    image: vithey-file-service:local
    container_name: vithey-file-service
    env_file:
      - .env.example
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    networks:
      - vithey-network

networks:
  vithey-network:
    external: true
