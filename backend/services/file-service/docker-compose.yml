services:
  file-postgres:
    image: postgres:16-alpine
    container_name: vithey-file-postgres
    environment:
      POSTGRES_DB: file_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - file-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d file_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - vithey-network

  file-service:
    build:
      context: ../..
      dockerfile: services/file-service/Dockerfile
      args:
        SERVICE_PORT: 8083
    image: vithey-file-service:local
    container_name: vithey-file-service
    env_file:
      - .env.example
    ports:
      - "8083:8083"
    depends_on:
      file-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    networks:
      - vithey-network

volumes:
  file-postgres-data:

networks:
  vithey-network:
    external: true
