services:
  profile-postgres:
    image: postgres:16-alpine
    container_name: vithey-profile-postgres
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - profile-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - vithey-network

  user-profile-service:
    build:
      context: ../..
      dockerfile: services/user-profile-service/Dockerfile
      args:
        SERVICE_PORT: 8082
    image: vithey-user-profile-service:local
    container_name: vithey-user-profile-service
    env_file:
      - .env.example
    ports:
      - "8082:8082"
    depends_on:
      profile-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    networks:
      - vithey-network

volumes:
  profile-postgres-data:

networks:
  vithey-network:
    external: true
