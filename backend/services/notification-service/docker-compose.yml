services:
  notification-postgres:
    image: postgres:16-alpine
    container_name: vithey-notification-postgres
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5439:5432"
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - vithey-network

  notification-service:
    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
      args:
        SERVICE_PORT: 8088
    image: vithey-notification-service:local
    container_name: vithey-notification-service
    env_file:
      - .env.example
    ports:
      - "8088:8088"
    depends_on:
      notification-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    networks:
      - vithey-network

volumes:
  notification-postgres-data:

networks:
  vithey-network:
    external: true
