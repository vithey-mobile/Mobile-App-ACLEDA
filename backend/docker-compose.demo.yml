# Profile M demo overrides — use WITH the main compose from backend/:
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build
#
# Goals (plan.md):
#   - All Vithey services live on one PC
#   - Tight RAM / JVM heaps for ~10 concurrent users
#   - ai_core for CV (DeepSeek API key)
#   - No GDCE / general-service
#   - map-service on shared Postgres (map_db)

name: vithey

x-java-demo: &java-demo
  JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m"

x-java-gateway: &java-gateway
  JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xms128m -Xmx384m -XX:MaxMetaspaceSize=160m"

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

services:
  postgres:
    command:
      - postgres
      - -c
      - max_connections=80
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - effective_cache_size=512MB
    mem_limit: 512m
    logging: *logging

  redis:
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 128m
    logging: *logging

  rabbitmq:
    mem_limit: 256m
    logging: *logging

  minio:
    mem_limit: 256m
    logging: *logging

  eureka-server:
    environment:
      <<: *java-demo
      SERVER_PORT: 8761
    mem_limit: 256m
    logging: *logging

  config-server:
    environment:
      <<: *java-demo
      SERVER_PORT: 8888
      CONFIG_REPO_LOCATION: file:/app/config-repo
      EUREKA_URL: http://eureka-server:8761/eureka/
    mem_limit: 256m
    logging: *logging

  auth-service:
    environment:
      <<: *java-demo
    mem_limit: 512m
    logging: *logging

  user-profile-service:
    environment:
      <<: *java-demo
    mem_limit: 512m
    logging: *logging

  file-service:
    environment:
      <<: *java-demo
    mem_limit: 512m
    logging: *logging

  content-service:
    environment:
      <<: *java-demo
    mem_limit: 512m
    logging: *logging

  career-service:
    environment:
      <<: *java-demo
    mem_limit: 512m
    logging: *logging

  finance-service:
    environment:
      <<: *java-demo
    mem_limit: 512m
    logging: *logging

  chat-service:
    environment:
      <<: *java-demo
    mem_limit: 512m
    logging: *logging

  notification-service:
    environment:
      <<: *java-demo
    mem_limit: 512m
    logging: *logging

  ai-service:
    environment:
      <<: *java-demo
      # Default: ai-core container on the compose network.
      # Host-run OpenRouter demo override: AI_CORE_BASE_URL=http://host.docker.internal:8100
      AI_CORE_BASE_URL: ${AI_CORE_BASE_URL:-http://ai-core:8100}
      VITHEY_AI_CHAT_MODE: stub
      # Do not point at GDCE for demo
      GENERAL_SERVICE_URL: http://127.0.0.1:9
    mem_limit: 512m
    depends_on:
      ai-core:
        condition: service_started
    logging: *logging

  api-gateway:
    environment:
      <<: *java-gateway
    mem_limit: 512m
    depends_on:
      map-service:
        condition: service_started
      ai-core:
        condition: service_started
    logging: *logging

  # ── map on shared postgres (map_db already in init-databases.sql) ─────────
  map-service:
    build:
      context: .
      dockerfile: services/map-service/Dockerfile
      args:
        SERVICE_PORT: 8090
    image: vithey-map-service:local
    container_name: vithey-map-service
    env_file:
      - services/map-service/.env.example
    environment:
      <<: *java-demo
      MAP_DB_URL: jdbc:postgresql://postgres:5432/map_db
      MAP_DB_USERNAME: postgres
      MAP_DB_PASSWORD: postgres
      SERVER_PORT: 8090
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_URL: http://eureka-server:8761/eureka/
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 12
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health | grep -q '\"status\":\"UP\"'"]
    networks:
      - vithey-network
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging

  # ── Python CV engine (DeepSeek API key) ───────────────────────────────────
  ai-core:
    build:
      context: ../ai_core
      dockerfile: Dockerfile
    image: vithey-ai-core:local
    container_name: vithey-ai-core
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://openrouter.ai/api/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-z-ai/glm-5.3-flash}
      MAX_POSTS_PER_BUILD: "20"
      MAX_CONTENT_CHARS: "2000"
      MAX_TOKENS: "2000"
      TIMEOUT_SECONDS: "60"
      API_RATE_LIMIT_PER_MINUTE: "20"
      CACHE_MAX_SIZE: "128"
      LOG_LEVEL: INFO
    env_file:
      - path: ../ai_core/.env
        required: false
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health')\""]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 8
    networks:
      - vithey-network
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
