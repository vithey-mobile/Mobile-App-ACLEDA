## System Architecture

.pull-left[
- **Flutter** mobile app (GetX + Dio)
- **API Gateway** — single entry (port 8080)
- **10 microservices** — each with own PostgreSQL DB
- **Shared infra** — Eureka, Redis, RabbitMQ, MinIO
]

.pull-right[
- **Event-driven** — RabbitMQ async messaging
- **Service discovery** — Eureka registry
- **File storage** — MinIO object store
- **Push notifications** — Firebase FCM
]

&lt;div class="slide-footer"&gt;&lt;div class="page-num"&gt;7 / 21&lt;/div&gt;&lt;/div&gt;

| Service | Port | Responsibility |
|---------|------|----------------|
| API Gateway | 8080 | Routing, JWT filter, rate limiting |
| Auth Service | 8081 | Register, login, JWT, OTP |
| Profile Service | 8082 | Profiles, settings, preferences |
| File Service | 8083 | Upload/download via MinIO |
| Content Service | 8084 | Posts, stories, comments, likes |

## API Gateway

&lt;div class="cols-2"&gt;
&lt;div&gt;
&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;Single entry point&lt;/strong&gt; for all client requests&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;JWT validation&lt;/strong&gt; before routing to services&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Load balancing&lt;/strong&gt; via Eureka discovery&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;CORS &amp; rate limiting&lt;/strong&gt; for security&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;div&gt;
&lt;ul&gt;
&lt;li&gt;&lt;strong&gt;Route mapping&lt;/strong&gt; — /api/auth/** → Auth&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Circuit breaker&lt;/strong&gt; — resilience4j fallback&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Request tracing&lt;/strong&gt; — centralized logging&lt;/li&gt;
&lt;li&gt;&lt;strong&gt;Port 8080&lt;/strong&gt; — exposed to Flutter app&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;

## Event-Driven Integration

| Event | Publisher | Consumer(s) |
|-------|-----------|-------------|
| user.registered | Auth | Profile, Notification |
| post.created | Content | Notification, AI |
| job.applied | Career | Notification |
| message.sent | Chat | Notification |
| payment.completed | Finance | Notification |
