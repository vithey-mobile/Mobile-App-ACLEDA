[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vithey-ai"
version = "0.1.0"
description = "AI core for Vithey CV generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["vithey_ai*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
