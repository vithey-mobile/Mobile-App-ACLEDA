global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - vithey-api-gateway:8080

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - vithey-auth-service:8081

  - job_name: user-profile-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - vithey-user-profile-service:8082

  - job_name: file-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - vithey-file-service:8083

  - job_name: content-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - vithey-content-service:8084

  - job_name: career-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - vithey-career-service:8085

  - job_name: finance-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - vithey-finance-service:8086

  - job_name: chat-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - vithey-chat-service:8087

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - vithey-notification-service:8088

  - job_name: ai-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - vithey-ai-service:8089
