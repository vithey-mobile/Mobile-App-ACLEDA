groups:
  - name: vithey-service-alerts
    rules:
      - alert: ServiceDown
        expr: up{job=~"api-gateway|auth-service|user-profile-service|file-service|content-service|career-service|finance-service|chat-service|notification-service|ai-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been unreachable for more than 1 minute."

      - alert: HighHttp5xxRate
        expr: |
          (
            sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
            sum by (application) (rate(http_server_requests_seconds_count[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx rate on {{ $labels.application }}"
          description: "More than 5% of HTTP requests returned 5xx over the last 5 minutes."

      - alert: DatabaseConnectionsHigh
        expr: |
          (
            hikaricp_connections_active
            /
            hikaricp_connections_max
          ) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "HikariCP pool for {{ $labels.pool }} is above 85% utilization."

  - name: vithey-infrastructure-alerts
    rules:
      - alert: HighCpuUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage has been above 80% for 5 minutes."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage has been above 85% for 5 minutes."
