# Full-stack CI: run backend + Flutter tests, then update `dev` when all jobs pass.
#
# Source branches (push only): kimheang, main
# Target branch after success: dev
#
# PRs run tests only — no auto-promote.

name: CI — Test & Promote to dev

on:
  push:
    branches: [kimheang, main]
  pull_request:
    branches: [kimheang, main, dev]
  workflow_dispatch:

concurrency:
  group: ci-promote-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run all backend module tests
        run: mvn -B -f backend/pom.xml test

      - name: Upload backend test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/**/target/surefire-reports/

  flutter-test:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vithey_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.16.9'
          cache: true

      - name: Prepare env file for assets
        run: cp .env.example .env

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  promote-to-dev:
    name: Promote passing commit to dev
    runs-on: ubuntu-latest
    needs: [backend-test, flutter-test]
    if: >-
      github.event_name == 'push' &&
      github.ref != 'refs/heads/dev' &&
      (github.ref == 'refs/heads/kimheang' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push current commit to dev branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin "${GITHUB_SHA}:refs/heads/dev"
        env:
          GITHUB_SHA: ${{ github.sha }}
