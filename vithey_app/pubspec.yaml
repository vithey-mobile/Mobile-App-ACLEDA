name: aub_connect_app
description: Vithey App — AUB student social, jobs, finance, chat, and AI assistant.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  get: ^4.6.6
  shadcn_flutter: ^0.0.52
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  flutter_dotenv: ^5.1.0
  intl: ^0.20.2
  cached_network_image: ^3.3.1
  lottie: ^3.0.0
  shimmer: ^3.0.0
  connectivity_plus: ^5.0.2
  logger: ^2.0.2
  file_picker: ^8.1.0
  image_picker: ^1.0.7
  video_player: ^2.8.2
  open_filex: ^4.4.0
  permission_handler: ^11.1.0
  url_launcher: ^6.2.4
  webview_flutter: ^4.10.0
  package_info_plus: ^8.0.0
  flutter_markdown: ^0.7.6
  share_plus: ^10.1.4
  web_socket_channel: ^3.0.1
  stomp_dart_client: ^2.0.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/brand/app_logo.png
    - assets/images/splash/
    - assets/images/onboarding/
    - assets/icons/
    - .env
