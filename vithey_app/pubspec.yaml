name: aub_connect_app
description: Vithey App — AUB student social, jobs, finance, chat, and AI assistant.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  get: ^4.6.6
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  lottie: ^3.0.0
  shimmer: ^3.0.0
  connectivity_plus: ^5.0.2
  logger: ^2.0.2
  file_picker: ^6.1.1
  image_picker: ^1.0.7
  video_player: ^2.8.2
  open_filex: ^4.4.0
  permission_handler: ^11.1.0
  url_launcher: ^6.2.4
  package_info_plus: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/brand/logo_app.png
    - assets/images/splash/
    - assets/images/onboarding/
    - assets/icons/
    - .env
